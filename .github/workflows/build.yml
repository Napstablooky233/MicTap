name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: windows / MinGW-w64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      - name: Build
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p build
          windres -I src src/MicTap.rc -O coff -o build/MicTap.res
          g++ src/MicTap.cpp build/MicTap.res \
              -std=c++17 -O2 -static -mwindows -municode \
              -lole32 -luuid -loleaut32 -lmmdevapi -lshell32 -lgdi32 -luser32 \
              -o build/MicTap.exe

      - name: Inspect binary
        shell: pwsh
        run: |
          Get-Item build\MicTap.exe | Select-Object FullName, Length
          (Get-Item build\MicTap.exe).VersionInfo | Select-Object FileVersion, ProductName
          $v = (Get-Item build\MicTap.exe).VersionInfo.FileVersion
          if (-not $v) { throw 'version resource missing' }

      - name: Smoke test
        shell: pwsh
        run: |
          # Exercise the console self-test paths so a released binary is never
          # shipped without having actually run. Discovery and routing both go
          # through the same code the UI uses.
          #
          # MicTap.exe is a WINDOWS-subsystem binary, so a plain invocation returns
          # immediately - Start-Process -Wait is required or the report file is not
          # there yet when the next line runs.
          Push-Location build
          function Invoke-SelfTest([string[]]$Arguments, [string]$Report) {
            $p = Start-Process -FilePath .\MicTap.exe -ArgumentList $Arguments -PassThru -Wait
            Write-Host "exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "MicTap.exe $Arguments exited with $($p.ExitCode)" }
            for ($i = 0; $i -lt 40 -and -not (Test-Path $Report); $i++) { Start-Sleep -Milliseconds 250 }
            if (-not (Test-Path $Report)) { throw "$Report was not written" }
            return Get-Content $Report
          }

          $dump = Invoke-SelfTest @('--dump') 'logs\discovery.txt'
          $header = $dump | Select-Object -First 1
          Write-Host "discovery: $header"
          if ($header -notmatch '^rows=\d+') { throw "unexpected dump header: $header" }
          if ([int]($header -replace 'rows=','') -lt 1) { throw 'discovery found no processes' }

          $report = Invoke-SelfTest @('--route','999999','2') 'logs\route-test.txt'
          Write-Host ($report -join "`n")
          if (-not ($report -match 'open=0')) { throw 'a non-existent pid was not rejected' }
          Pop-Location

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicTap-windows-x64
          path: build/MicTap.exe
          if-no-files-found: error

  release:
    name: attach release asset
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MicTap-windows-x64
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MicTap.exe
          generate_release_notes: true
