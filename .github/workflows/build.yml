name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: windows / MinGW-w64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
          path-type: inherit

      - name: Build
        shell: cmd
        run: |
          set "MINGW_BIN=C:\msys64\mingw64\bin"
          call build.cmd

      - name: Show binary
        shell: pwsh
        run: |
          Get-Item build\MicTap.exe | Select-Object FullName, Length
          (Get-Item build\MicTap.exe).VersionInfo | Select-Object FileVersion, ProductName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicTap-windows-x64
          path: build/MicTap.exe
          if-no-files-found: error

  release:
    name: attach release asset
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MicTap-windows-x64
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MicTap.exe
          generate_release_notes: true
